<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Lista de Asistentes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: #333; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); max-width: 650px; width: 100%; text-align: left; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 1.4rem; color: #002b49; margin: 0; }
        #nombreEvento { color: #f39c12; font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        
        .contador-box { background: #f1f2f6; padding: 12px 15px; border-radius: 10px; font-size: 1rem; color: #2f3640; font-weight: bold; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .contador-box span { color: #002b49; font-size: 1.2rem; }

        .btn-regresar { background: #718093; color: white; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
        .btn-regresar:hover { background: #2f3640; }

        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #e9ecef; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th { background: #f8f9fa; color: #002b49; padding: 14px 18px; border-bottom: 2px solid #dee2e6; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        td { padding: 14px 18px; border-bottom: 1px solid #e9ecef; color: #495057; }
        tr:hover { background-color: #f8f9fa; }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 0.85rem; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h1>📋 Registro de Asistencia</h1>
            <a href="index.html" class="btn-regresar">⬅️ Volver al Panel</a>
        </div>
        
        <div id="nombreEvento">Cargando evento...</div>

        <!-- CONTADOR DE CANTIDAD TOTAL DE PERSONAS -->
        <div class="contador-box">
            Total de personas asistentes: <span id="totalAsistentes">0</span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80%;">MATRÍCULA / REGISTRO</th>
                        <th style="width: 20%; text-align: center;">NÚMERO</th>
                    </tr>
                </thead>
                <tbody id="tablaAsistentesBody">
                    <tr><td colspan="2" style="text-align: center;">Cargando registros...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="msgEstado" class="msg"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tablaAsistentesBody = document.getElementById('tablaAsistentesBody');
        const nombreEventoEl = document.getElementById('nombreEvento');
        const totalAsistentesEl = document.getElementById('totalAsistentes');
        const msgEstado = document.getElementById('msgEstado');

        async function cargarAsistentes() {
            try {
                // Obtiene el evento activo actual
                const { data: eventoData, error: eventoError } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .eq('activo', true)
                    .limit(1);

                if (eventoError || !eventoData || eventoData.length === 0) {
                    nombreEventoEl.textContent = "⚠️ No hay un evento activo seleccionado.";
                    tablaAsistentesBody.innerHTML = '<tr><td colspan="2" style="text-align: center;">Sin datos.</td></tr>';
                    return;
                }

                const evento = eventoData[0];
                nombreEventoEl.textContent = `Clase / Conferencia: ${evento.nombre} (${evento.clave_evento || 'N/D'})`;

                // Carga las asistencias ordenadas por fecha_registro usando la columna correcta
                const { data: asistenciasData, error: asisError } = await supabaseClient
                    .from('asistencias')
                    .select('*')
                    .eq('evento_id', evento.id)
                    .order('fecha_registro', { ascending: false });

                if (asisError) throw asisError;

                tablaAsistentesBody.innerHTML = '';
                if (!asistenciasData || asistenciasData.length === 0) {
                    tablaAsistentesBody.innerHTML = '<tr><td colspan="2" style="text-align: center;">Aún no hay registros de asistencia.</td></tr>';
                    totalAsistentesEl.textContent = "0";
                    return;
                }

                // Muestra la cantidad total de personas basadas en los registros
                totalAsistentesEl.textContent = asistenciasData.length;

                asistenciasData.forEach((asis, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${asis.matricula || 'S/N'}</b></td>
                        <td style="text-align: center; color: #718093; font-weight: bold;">#${index + 1}</td>
                    `;
                    tablaAsistentesBody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                msgEstado.className = "msg error";
                msgEstado.textContent = "Error al cargar la lista de asistentes.";
            }
        }

        cargarAsistentes();
    </script>
</body>
</html>
