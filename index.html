<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Panel de Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: #333; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); max-width: 850px; width: 100%; text-align: left; }
        h1 { font-size: 1.5rem; color: #002b49; text-align: center; margin-top: 0; margin-bottom: 20px; }
        
        .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        input[type="text"], input[type="number"] { padding: 10px; border: 2px solid #dfe4ea; border-radius: 8px; font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: #002b49; }
        
        .buscador { flex-grow: 1; max-width: 400px; }
        
        button { padding: 10px 16px; background: #002b49; color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #003f6b; }
        .btn-secundario { background: #718093; }
        .btn-secundario:hover { background: #2f3640; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #d35400; }
        .btn-info { background: #009432; color: white; }
        .btn-info:hover { background: #006266; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }

        /* ESTILOS DE LA TABLA */
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; border: 1px solid #e9ecef; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: #f8f9fa; color: #002b49; padding: 12px 15px; border-bottom: 2px solid #dee2e6; font-weight: bold; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        td { padding: 12px 15px; border-bottom: 1px solid #e9ecef; color: #495057; vertical-align: middle; }
        tr:hover { background-color: #f8f9fa; }
        .badge-activo { background: #2ecc71; color: white; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        
        .acciones-td { display: flex; gap: 6px; flex-wrap: wrap; }
        .acciones-td button { padding: 6px 10px; font-size: 0.8rem; }

        .msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 0.85rem; }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }

        /* ESTILOS DEL MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; max-width: 385px; width: 90%; color: #333; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 24px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .modal-content label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #444; }
        .modal-content input { width: 100%; margin-top: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Panel de Control - Gestión de Eventos</h1>
        
        <!-- BARRA SUPERIOR: BUSCADOR Y BOTÓN NUEVO EVENTO -->
        <div class="top-actions">
            <input type="text" id="inputBuscador" class="buscador" placeholder="🔍 Buscar evento por nombre o clave..." oninput="filtrarEventos()">
            <button onclick="abrirModalNuevo()" class="btn-success">➕ Registrar Nuevo Evento</button>
        </div>

        <!-- TABLA DE EVENTOS -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NOMBRE DEL EVENTO</th>
                        <th>CLAVE</th>
                        <th>RADIO (M)</th>
                        <th>ESTATUS</th>
                        <th>ACCIONES</th>
                    </tr>
                ></tr>
                <tbody id="tablaEventosBody">
                    <tr><td colspan="6" style="text-align: center;">Cargando eventos...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="msgEstado" class="msg"></div>
    </div>

    <!-- MODAL PARA NUEVO EVENTO -->
    <div id="modalNuevo" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalNuevo()">&times;</span>
            <h3>➕ Crear Nuevo Evento</h3>
            <form id="formNuevoEvento" onsubmit="crearNuevoEvento(event)">
                <label for="nuevoNombre">Nombre de la Clase/Conferencia:</label>
                <input type="text" id="nuevoNombre" placeholder="Ej. Arquitectura de Software" required>

                <label for="nuevaClave">Clave Única:</label>
                <input type="text" id="nuevaClave" placeholder="Ej. ARQ_2026" required>

                <button type="submit" id="btnCrear" class="btn-success" style="width: 100%; margin-top: 15px;">Crear y Activar Evento</button>
            </form>
        </div>
    </div>

    <!-- MODAL PARA EDITAR EVENTO -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalEditar()">&times;</span>
            <h3>✏️ Editar Evento</h3>
            <form id="formEditarEvento" onsubmit="guardarEdicionEvento(event)">
                <input type="hidden" id="editId">
                <label for="editNombre">Nombre del Evento:</label>
                <input type="text" id="editNombre" required>

                <label for="editClave">Clave Única:</label>
                <input type="text" id="editClave" required>

                <label for="editRadio">Radio de Cobertura (Metros):</label>
                <input type="number" id="editRadio" min="10" max="500" required>

                <button type="submit" id="btnGuardarEdit" class="btn-success" style="width: 100%; margin-top: 15px;">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tablaEventosBody = document.getElementById('tablaEventosBody');
        const inputBuscador = document.getElementById('inputBuscador');
        const msgEstado = document.getElementById('msgEstado');
        
        let listaEventosGlobal = [];

        async function cargarEventos() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                listaEventosGlobal = data || [];
                renderizarTabla(listaEventosGlobal);

            } catch (err) {
                console.error(err);
                msgEstado.className = "msg error";
                msgEstado.textContent = "Error al cargar los eventos.";
            }
        }

        function renderizarTabla(eventos) {
            tablaEventosBody.innerHTML = '';
            if (eventos.length === 0) {
                tablaEventosBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No se encontraron eventos.</td></tr>';
                return;
            }

            eventos.forEach(ev => {
                const tr = document.createElement('tr');
                
                const estatusHtml = ev.activo 
                    ? '<span class="badge-activo">Activo</span>' 
                    : '<button onclick="activarEvento(' + ev.id + ')" class="btn-secundario" style="padding: 4px 8px; font-size: 0.75rem;">Activar</button>';

                tr.innerHTML = `
                    <td><b>#${ev.id}</b></td>
                    <td>${ev.nombre}</td>
                    <td><b>${ev.clave_evento}</b></td>
                    <td>${ev.radio_metros || 70}m</td>
                    <td>${estatusHtml}</td>
                    <td>
                        <div class="acciones-td">
                            <button onclick="irAVerQR(${ev.id})" class="btn-warning" title="Ver QR">📷 QR</button>
                            <button onclick="irAVerAsistentes(${ev.id})" class="btn-info" title="Ver Asistentes">📋 Asistentes</button>
                            <button onclick="abrirModalEditar(${ev.id})" class="btn-secundario" title="Editar">✏️ Editar</button>
                        </div>
                    </td>
                `;
                tablaEventosBody.appendChild(tr);
            });
        }

        // Buscador instantáneo por letra
        function filtrarEventos() {
            const texto = inputBuscador.value.toLowerCase().trim();
            const filtrados = listaEventosGlobal.filter(ev => 
                ev.nombre.toLowerCase().includes(texto) || 
                ev.clave_evento.toLowerCase().includes(texto)
            );
            renderizarTabla(filtrados);
        }

        async function activarEvento(id) {
            try {
                await supabaseClient.from('eventos').update({ activo: false }).neq('id', 0);
                const { error } = await supabaseClient.from('eventos').update({ activo: true }).eq('id', id);
                if (error) throw error;
                await cargarEventos();
            } catch (err) {
                alert("Error al activar evento: " + err.message);
            }
        }

        // Controladores de Modales
        function abrirModalNuevo() { document.getElementById('modalNuevo').style.display = 'flex'; }
        function cerrarModalNuevo() { document.getElementById('modalNuevo').style.display = 'none'; }

        function abrirModalEditar(id) {
            const ev = listaEventosGlobal.find(item => item.id === id);
            if (!ev) return;
            
            document.getElementById('editId').value = ev.id;
            document.getElementById('editNombre').value = ev.nombre;
            document.getElementById('editClave').value = ev.clave_evento;
            document.getElementById('editRadio').value = ev.radio_metros || 70;
            document.getElementById('modalEditar').style.display = 'flex';
        }
        function cerrarModalEditar() { document.getElementById('modalEditar').style.display = 'none'; }

        async function crearNuevoEvento(e) {
            e.preventDefault();
            const nombre = document.getElementById('nuevoNombre').value.trim();
            const clave = document.getElementById('nuevaClave').value.trim().toUpperCase();
            const btnCrear = document.getElementById('btnCrear');

            btnCrear.disabled = true;
            btnCrear.textContent = "Creando...";

            try {
                await supabaseClient.from('eventos').update({ activo: false }).neq('id', 0);

                const { error } = await supabaseClient
                    .from('eventos')
                    .insert([{ nombre: nombre, clave_evento: clave, activo: true, radio_metros: 70 }]);

                if (error) {
                    if (error.code === '23505') throw new Error("La clave de evento ya existe.");
                    throw error;
                }

                cerrarModalNuevo();
                document.getElementById('formNuevoEvento').reset();
                await cargarEventos();

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btnCrear.disabled = false;
                btnCrear.textContent = "Crear y Activar Evento";
            }
        }

        async function guardarEdicionEvento(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const nuevoNombre = document.getElementById('editNombre').value.trim();
            const nuevaClave = document.getElementById('editClave').value.trim().toUpperCase();
            const nuevoRadio = parseInt(document.getElementById('editRadio').value);
            const btnGuardar = document.getElementById('btnGuardarEdit');

            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando...";

            try {
                const { error } = await supabaseClient
                    .from('eventos')
                    .update({ nombre: nuevoNombre, clave_evento: nuevaClave, radio_metros: nuevoRadio })
                    .eq('id', id);

                if (error) throw error;

                cerrarModalEditar();
                await cargarEventos();

            } catch (err) {
                alert("Error al actualizar: " + err.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Guardar Cambios";
            }
        }

        async function irAVerQR(id) {
            await activarEvento(id);
            window.location.href = 'admin.html';
        }

        async function irAVerAsistentes(id) {
            await activarEvento(id);
            window.location.href = 'asistentes.html';
        }

        cargarEventos();
    </script>
</body>
</html>
