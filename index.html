<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Registro de Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; max-width: 380px; width: 100%; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        h2 { color: #002b49; margin-top: 0; font-size: 1.5rem; }
        .status-box { font-size: 0.95rem; margin: 20px 0; line-height: 1.5; color: #555; }
        .error { color: #e74c3c; font-weight: bold; }
        .success { color: #2ecc71; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border: 2px solid #dfe4ea; border-radius: 8px; font-size: 1rem; text-align: center; outline: none; transition: 0.2s; }
        input:focus { border-color: #002b49; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #002b49; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #003f6b; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎓 SIASE UANL</h2>
    <div id="mensaje" class="status-box">🔄 Validando seguridad y ubicación...</div>

    <form id="formAsistencia" style="display: none;" onsubmit="registrarAsistencia(event)">
        <input type="text" id="matricula" placeholder="Ingresa tu Matrícula" required maxlength="10" autocomplete="off">
        <button type="submit" id="btnEnviar">✨ Confirmar Asistencia</button>
    </form>
</div>

<script>
    const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const tokenRecibido = urlParams.get('token');
    const claveEvento = urlParams.get('clave');
    
    const mensajeEl = document.getElementById('mensaje');
    const formEl = document.getElementById('formAsistencia');
    const RADIO_METROS_PERMITIDO = 70;

    function calcularDistanciaMetros(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    async function obtenerHuellaDispositivo() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'unknown';

            let audioHash = "no-audio";
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const analyser = audioCtx.createAnalyser();
                const gainNode = audioCtx.createGain();
                const scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

                oscillator.type = 'triangle';
                oscillator.frequency.value = 10000;
                
                scriptProcessor.onaudioprocess = function (e) {
                    const output = e.inputBuffer.getChannelData(0);
                    let sum = 0;
                    for (let i = 0; i < output.length; i++) {
                        sum += Math.abs(output[i]);
                    }
                    audioHash = sum.toString();
                    oscillator.stop();
                    audioCtx.close();
                };

                oscillator.connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(scriptProcessor);
                scriptProcessor.connect(audioCtx.destination);
                oscillator.start(0);
            } catch (err) {
                audioHash = "audio-blocked";
            }

            const datosHardware = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                gpu,
                audioHash
            ].join('|||');

            const encoder = new TextEncoder();
            const data = encoder.encode(datosHardware);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return 'FP_' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32);
        } catch (e) {
            return 'FP_FALLBACK_' + screen.width + 'x' + screen.height + '_' + Math.random();
        }
    }

    async function validarTokenAleatorio(clave) {
        const bloqueActual = Math.floor(Date.now() / 15000);
        
        for (let offset of [0, -1, 1]) {
            const bloqueEval = bloqueActual + offset;
            const textoSecreto = clave + "_" + bloqueEval + "_FACP_AFI_SECRET_2026";
            const encoder = new TextEncoder();
            const data = encoder.encode(textoSecreto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const tokenGenerado = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 10);
            
            if (tokenGenerado === tokenRecibido) return true;
        }
        return false;
    }

    async function iniciarValidacionHandshake() {
        if (!tokenRecibido || !claveEvento) {
            mostrarError("❌ Enlace inválido o incompleto. Por favor, escanea el código QR oficial.");
            return;
        }

        try {
            const esValido = await validarTokenAleatorio(claveEvento);
            if (!esValido) {
                mostrarError("⚠️ El código QR ha expirado o se detectó una captura de pantalla.");
                return;
            }

            const { data: eventoData, error: eventoError } = await supabaseClient
                .from('eventos')
                .select('id, lat, lon')
                .eq('clave_evento', claveEvento)
                .single();

            if (eventoError || !eventoData) {
                mostrarError("❌ El evento asociado no es válido o ya finalizó.");
                return;
            }

            if (!eventoData.lat || !eventoData.lon) {
                mostrarError("⏳ El profesor aún no transmite su ubicación GPS.");
                return;
            }

            const dispositivoFingerprint = await obtenerHuellaDispositivo();
            const fechaExpiracion = new Date(Date.now() + 2 * 60 * 1000).toISOString();

            await supabaseClient
                .from('sesiones_temporales')
                .upsert([
                    {
                        evento_id: eventoData.id,
                        dispositivo_id: dispositivoFingerprint,
                        expires_at: fechaExpiracion
                    }
                ], { onConflict: 'evento_id,dispositivo_id' });

            window.currentEventoId = eventoData.id;
            window.currentDeviceFP = dispositivoFingerprint;
            window.maestroLat = eventoData.lat;
            window.maestroLon = eventoData.lon;

            if (!navigator.geolocation) {
                mostrarError("❌ Tu navegador no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const alumnoLat = position.coords.latitude;
                const alumnoLon = position.coords.longitude;
                const precisionMetros = position.coords.accuracy;

                if (precisionMetros > 100) {
                    mostrarError(`⚠️ Ubicación imprecisa (${Math.round(precisionMetros)}m). Activa la ubicación **Precisa** en tu celular.`);
                    return;
                }

                const distancia = calcularDistanciaMetros(alumnoLat, alumnoLon, window.maestroLat, window.maestroLon);
                if (distancia > RADIO_METROS_PERMITIDO) {
                    mostrarError(`❌ Estás demasiado lejos del profesor (a ${Math.round(distancia)} metros). Acércate al salón.`);
                    return;
                }

                mensajeEl.innerHTML = "<p class='success'>✅ ¡Ubicación y pase en vivo validados con éxito!</p>";
                formEl.style.display = 'block';

            }, (error) => {
                mostrarError("⚠️ Es obligatorio permitir el acceso a tu ubicación GPS para registrar asistencia.");
            }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });

        } catch (err) {
            console.error(err);
            mostrarError("❌ Ocurrió un error al procesar la validación.");
        }
    }

    function mostrarError(msg) {
        mensajeEl.innerHTML = `<p class='error'>${msg}</p>`;
        formEl.style.display = 'none';
    }

    async function registrarAsistencia(event) {
        event.preventDefault();
        const matricula = document.getElementById('matricula').value.trim();
        const btnEnviar = document.getElementById('btnEnviar');
        btnEnviar.disabled = true;
        btnEnviar.textContent = "⏳ Registrando...";

        try {
            const { data: sesionData, error: sesionError } = await supabaseClient
                .from('sesiones_temporales')
                .select('expires_at')
                .eq('evento_id', window.currentEventoId)
                .eq('dispositivo_id', window.currentDeviceFP)
                .single();

            if (sesionError || !sesionData || new Date(sesionData.expires_at) < new Date()) {
                throw new Error("El tiempo de sesión ha expirado. Vuelve a escanear el QR.");
            }

            const { error: insertError } = await supabaseClient
                .from('asistencias')
                .insert([
                    {
                        evento_id: window.currentEventoId,
                        matricula: matricula,
                        token_usado: tokenRecibido,
                        dispositivo_id: window.currentDeviceFP
                    }
                ]);

            if (insertError) {
                if (insertError.code === '23505') {
                    throw new Error("Esta matrícula o dispositivo ya cuenta con asistencia registrada.");
                } else {
                    throw new Error(insertError.message);
                }
            }

            mensajeEl.innerHTML = `<p class='success'>🎉 ¡Asistencia registrada con éxito!<br>Matrícula: <b>${matricula}</b></p>`;
            formEl.style.display = 'none';

        } catch (err) {
            mostrarError("❌ " + err.message);
            btnEnviar.disabled = false;
            btnEnviar.textContent = "✨ Confirmar Asistencia";
        }
    }

    iniciarValidacionHandshake();
</script>

</body>
</html>
