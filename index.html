<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Panel de Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { background: white; color: #333; display: inline-block; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); max-width: 440px; width: 100%; text-align: left; }
        h1 { font-size: 1.4rem; color: #002b49; text-align: center; margin-top: 0; }
        h3 { color: #002b49; font-size: 0.95rem; margin: 0 0 10px 0; border-bottom: 2px solid #f1f2f6; padding-bottom: 8px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #444; }
        input { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 2px solid #dfe4ea; border-radius: 8px; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #002b49; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #002b49; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #003f6b; }
        .btn-secundario { background: #718093; }
        .btn-secundario:hover { background: #2f3640; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #d35400; }
        .btn-info { background: #009432; }
        .btn-info:hover { background: #006266; }
        .seccion { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e9ecef; }
        .evento-activo-box { font-size: 1.05rem; color: #2d3436; font-weight: bold; margin-bottom: 10px; text-align: center; background: #dfe6e9; padding: 12px; border-radius: 8px; }
        .msg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 0.85rem; }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }

        /* ESTILOS DEL MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; max-width: 385px; width: 90%; color: #333; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .close { color: #aaa; float: right; font-size: 24px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Panel de Control</h1>
        
        <!-- BOTÓN SUPERIOR PARA ABRIR MODAL DE NUEVO EVENTO -->
        <button onclick="abrirModalNuevo()" class="btn-secundario" style="margin-bottom: 15px;">➕ Registrar Nuevo Evento</button>

        <!-- SECCIÓN: EVENTO ACTIVO ACTUAL -->
        <div class="seccion" style="margin-bottom: 0;">
            <h3>🚀 Evento Activo Actual</h3>
            <div id="infoEventoActivo" class="evento-activo-box">Cargando evento activo...</div>

            <!-- Botón para editar el evento activo actual -->
            <button onclick="abrirModalEditar()" class="btn-info" style="margin-top: 0; margin-bottom: 12px;">✏️ Editar Nombre y Clave</button>

            <label for="inputDistancia">Distancia de Cobertura (Metros):</label>
            <input type="number" id="inputDistancia" value="70" min="10" max="500">
            <button onclick="actualizarDistancia()" class="btn-success">💾 Guardar Nueva Distancia</button>

            <!-- DOS BOTONES PRINCIPALES -->
            <button onclick="irAVerQR()" class="btn-warning" style="margin-top: 15px;">📷 Ver QR del Evento</button>
            <button onclick="irAVerAsistentes()" class="btn-secundario" style="margin-top: 8px;">📋 Ver Asistentes</button>
        </div>

        <div id="msgEstado" class="msg"></div>
    </div>

    <!-- MODAL PARA NUEVO EVENTO -->
    <div id="modalNuevo" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalNuevo()">&times;</span>
            <h3>➕ Crear Nuevo Evento</h3>
            <form id="formNuevoEvento" onsubmit="crearNuevoEvento(event)">
                <label for="nuevoNombre">Nombre de la Clase/Conferencia:</label>
                <input type="text" id="nuevoNombre" placeholder="Ej. Arquitectura de Software" required>

                <label for="nuevaClave">Clave Única:</label>
                <input type="text" id="nuevaClave" placeholder="Ej. ARQ_2026" required>

                <button type="submit" id="btnCrear" class="btn-success">Crear y Activar Evento</button>
            </form>
        </div>
    </div>

    <!-- MODAL PARA EDITAR EVENTO ACTIVO -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalEditar()">&times;</span>
            <h3>✏️ Editar Evento Activo</h3>
            <form id="formEditarEvento" onsubmit="guardarEdicionEvento(event)">
                <label for="editNombre">Nombre del Evento:</label>
                <input type="text" id="editNombre" required>

                <label for="editClave">Clave Única:</label>
                <input type="text" id="editClave" required>

                <button type="submit" id="btnGuardarEdit" class="btn-success">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const infoEventoActivo = document.getElementById('infoEventoActivo');
        const inputDistancia = document.getElementById('inputDistancia');
        const msgEstado = document.getElementById('msgEstado');
        
        let eventoIdActual = null;
        let nombreActual = "";
        let claveActual = "";

        async function cargarEventoActivo() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .eq('activo', true)
                    .single();

                if (error || !data) {
                    infoEventoActivo.textContent = "⚠️ No hay ningún evento activo";
                    return;
                }

                eventoIdActual = data.id;
                nombreActual = data.nombre;
                claveActual = data.clave_evento;
                
                infoEventoActivo.textContent = `${data.nombre} (${data.clave_evento})`;
                inputDistancia.value = data.radio_metros || 70;

            } catch (err) {
                console.error(err);
                msgEstado.className = "msg error";
                msgEstado.textContent = "Error al conectar con la base de datos.";
            }
        }

        // Controladores de Modales
        function abrirModalNuevo() { document.getElementById('modalNuevo').style.display = 'flex'; }
        function cerrarModalNuevo() { document.getElementById('modalNuevo').style.display = 'none'; }

        function abrirModalEditar() {
            if (!eventoIdActual) {
                alert("No hay un evento activo para editar.");
                return;
            }
            document.getElementById('editNombre').value = nombreActual;
            document.getElementById('editClave').value = claveActual;
            document.getElementById('modalEditar').style.display = 'flex';
        }
        function cerrarModalEditar() { document.getElementById('modalEditar').style.display = 'none'; }

        async function crearNuevoEvento(e) {
            e.preventDefault();
            const nombre = document.getElementById('nuevoNombre').value.trim();
            const clave = document.getElementById('nuevaClave').value.trim().toUpperCase();
            const btnCrear = document.getElementById('btnCrear');

            btnCrear.disabled = true;
            btnCrear.textContent = "Creando...";

            try {
                await supabaseClient.from('eventos').update({ activo: false }).neq('id', 0);

                const { error } = await supabaseClient
                    .from('eventos')
                    .insert([{ nombre: nombre, clave_evento: clave, activo: true, radio_metros: 70 }]);

                if (error) {
                    if (error.code === '23505') throw new Error("La clave de evento ya existe.");
                    throw error;
                }

                cerrarModalNuevo();
                msgEstado.className = "msg success";
                msgEstado.textContent = "¡Evento creado y activado con éxito!";
                document.getElementById('formNuevoEvento').reset();
                await cargarEventoActivo();

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btnCrear.disabled = false;
                btnCrear.textContent = "Crear y Activar Evento";
            }
        }

        async function guardarEdicionEvento(e) {
            e.preventDefault();
            const nuevoNombre = document.getElementById('editNombre').value.trim();
            const nuevaClave = document.getElementById('editClave').value.trim().toUpperCase();
            const btnGuardar = document.getElementById('btnGuardarEdit');

            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando...";

            try {
                const { error } = await supabaseClient
                    .from('eventos')
                    .update({ nombre: nuevoNombre, clave_evento: nuevaClave })
                    .eq('id', eventoIdActual);

                if (error) throw error;

                cerrarModalEditar();
                msgEstado.className = "msg success";
                msgEstado.textContent = "✅ Evento actualizado correctamente.";
                await cargarEventoActivo();

            } catch (err) {
                alert("Error al actualizar: " + err.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Guardar Cambios";
            }
        }

        async function actualizarDistancia() {
            if (!eventoIdActual) return;
            const nuevaDistancia = parseInt(inputDistancia.value);

            try {
                const { error } = await supabaseClient
                    .from('eventos')
                    .update({ radio_metros: nuevaDistancia })
                    .eq('id', eventoIdActual);

                if (error) throw error;

                msgEstado.className = "msg success";
                msgEstado.textContent = "✅ Distancia actualizada correctamente.";
            } catch (err) {
                msgEstado.className = "msg error";
                msgEstado.textContent = "Error al actualizar distancia.";
            }
        }

        function irAVerQR() {
            if (!eventoIdActual) {
                alert("Primero debes crear o tener un evento activo.");
                return;
            }
            window.location.href = 'admin.html';
        }

        function irAVerAsistentes() {
            if (!eventoIdActual) {
                alert("No hay un evento activo seleccionado.");
                return;
            }
            window.location.href = 'asistentes.html';
        }

        cargarEventoActivo();
    </script>
</body>
</html>
