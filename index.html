<!DOCTYPE html>
<html lang="es">
<head>

        tr:hover { background-color: #f8f9fa; }
        
        .acciones-td { display: flex; gap: 8px; flex-wrap: wrap; }
        .acciones-td button { padding: 8px 12px; font-size: 0.85rem; }

        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
