<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Control de Asistencia AFI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: white; text-align: center; padding: 30px; margin: 0; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; }
        #nombreEvento { color: #f39c12; font-size: 1.4rem; margin-bottom: 10px; font-weight: bold; }
        .info-config { font-size: 0.95rem; color: #dfe4ea; margin-bottom: 20px; }
        .container { background: white; color: #333; display: inline-block; padding: 25px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); max-width: 350px; width: 100%; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; }
        .timer { font-size: 1.1rem; font-weight: bold; color: #e74c3c; margin-top: 15px; }
        .error-gps { color: #ff6b6b; font-weight: bold; margin-top: 15px; font-size: 0.9rem; }
        .btn-volver { display: inline-block; margin-top: 20px; background: rgba(255,255,255,0.1); color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
        .btn-volver:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <h1>SIASE - Panel del Expositor</h1>
    <div id="nombreEvento">🔄 Sincronizando evento...</div>
    <div id="infoConfig" class="info-config"></div>

    <div class="container">
        <div id="qrcode"></div>
        <p class="timer">⏱️ El código rota en: <span id="countdown">15</span>s</p>
    </div>
    
    <div id="msgGps" class="error-gps"></div>
    <br>
    <a href="index.html" class="btn-volver">⚙️ Cambiar Evento / Configuración</a>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const qrContainer = document.getElementById("qrcode");
        const countdownEl = document.getElementById("countdown");
        const nombreEventoEl = document.getElementById("nombreEvento");
        const infoConfigEl = document.getElementById("infoConfig");
        const msgGpsEl = document.getElementById("msgGps");
        
        let qrcode = new QRCode(qrContainer, { width: 240, height: 240 });
        let timeLeft = 15;
        let eventoActualId = null;
        let eventoActualClave = "EVENTO_DEFAULT";

        async function generarTokenAleatorio(clave) {
            const bloque = Math.floor(Date.now() / 15000);
            const textoSecreto = clave + "_" + bloque + "_FACP_AFI_SECRET_2026";
            const encoder = new TextEncoder();
            const data = encoder.encode(textoSecreto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 10);
        }

        async function iniciarSistema() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .eq('activo', true)
                    .single();

                if (error || !data) {
                    nombreEventoEl.textContent = "⚠️ No hay eventos activos";
                    infoConfigEl.textContent = "Selecciona un evento en la página principal.";
                    return;
                }

                eventoActualId = data.id;
                eventoActualClave = data.clave_evento;
                nombreEventoEl.textContent = data.nombre;
                infoConfigEl.textContent = `📍 Cobertura configurada: ${data.radio_metros || 70} metros`;

                if (!navigator.geolocation) {
                    msgGpsEl.textContent = "⚠️ Tu navegador no soporta geolocalización.";
                    return;
                }

                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    await supabaseClient
                        .from('eventos')
                        .update({ lat: lat, lon: lon })
                        .eq('id', eventoActualId);

                    msgGpsEl.textContent = ""; 
                    await actualizarQR();

                    setInterval(async () => {
                        timeLeft--;
                        countdownEl.textContent = timeLeft;
                        if (timeLeft <= 0) {
                            await actualizarQR();
                        }
                    }, 1000);

                }, (error) => {
                    msgGpsEl.textContent = "⚠️ Debes permitir el acceso a tu ubicación GPS.";
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });

            } catch (err) {
                console.error("Error general:", err);
                nombreEventoEl.textContent = "❌ Error de conexión con la base de datos";
            }
        }

        async function actualizarQR() {
            const tokenAleatorio = await generarTokenAleatorio(eventoActualClave);
            // El QR apunta a la página de asistencia del alumno en la raíz con su respectivo archivo o parámetro
            const urlEstudiante = `https://1jecc.github.io/honorio/asistencia.html?token=${tokenAleatorio}&clave=${eventoActualClave}`;
            
            qrcode.makeCode(urlEstudiante);
            timeLeft = 15;
        }

        iniciarSistema();
    </script>
</body>
</html>
