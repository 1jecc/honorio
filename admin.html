<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Panel del Expositor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: white; text-align: center; padding: 20px; margin: 0; }
        h1 { font-size: 1.6rem; margin-bottom: 5px; }
        .dashboard-layout { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; align-items: flex-start; }
        .card { background: white; color: #333; padding: 20px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); max-width: 350px; width: 100%; text-align: left; }
        .card h3 { color: #002b49; margin-top: 0; font-size: 1.2rem; text-align: center; }
        #qrcode { margin: 15px auto; display: flex; justify-content: center; }
        .timer { font-size: 1.1rem; font-weight: bold; color: #e74c3c; text-align: center; margin-top: 10px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; color: #444; }
        select, input { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 2px solid #dfe4ea; border-radius: 8px; font-size: 0.95rem; outline: none; }
        select:focus, input:focus { border-color: #002b49; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #002b49; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #003f6b; }
        .btn-secundario { background: #718093; margin-top: 8px; }
        .btn-secundario:hover { background: #2f3640; }
        .msg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 0.85rem; }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .error-gps { color: #ff6b6b; font-weight: bold; margin-top: 10px; font-size: 0.85rem; }
        #nombreEvento { color: #f39c12; font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 5px; }
        .info-config { font-size: 0.85rem; color: #dfe4ea; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>SIASE - Panel del Expositor</h1>
    <div id="nombreEvento">🔄 Sincronizando evento...</div>
    <div id="infoConfig" class="info-config"></div>

    <div class="dashboard-layout">
        <!-- SECCIÓN 1: PROYECTAR QR -->
        <div class="card" style="text-align: center;">
            <h3>📱 Código QR Activo</h3>
            <div id="qrcode"></div>
            <p class="timer">⏱️ Rota en: <span id="countdown">15</span>s</p>
            <div id="msgGps" class="error-gps"></div>
        </div>

        <!-- SECCIÓN 2: ADMINISTRAR Y CREAR EVENTOS -->
        <div class="card">
            <h3>⚙️ Cambiar / Crear Evento</h3>
            
            <label for="selectEvento">Seleccionar Activo:</label>
            <select id="selectEvento" onchange="cambiarEventoActivo()">
                <option value="">Cargando eventos...</option>
            </select>

            <label for="inputDistancia">Radio de Cobertura (m):</label>
            <input type="number" id="inputDistancia" value="70" min="10" max="500" onchange="actualizarRadioCobertura()">

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <form id="formNuevoEvento" onsubmit="crearNuevoEvento(event)">
                <h4 style="margin: 0 0 10px 0; color: #002b49; font-size: 1rem;">➕ Registrar Nuevo Evento</h4>
                
                <label for="nuevoNombre">Nombre de la Clase/Conferencia:</label>
                <input type="text" id="nuevoNombre" placeholder="Ej. Arquitectura de Software" required>

                <label for="nuevaClave">Clave Única:</label>
                <input type="text" id="nuevaClave" placeholder="Ej. ARQ_2026" required>

                <button type="submit" id="btnCrear" class="btn-secundario">Crear y Activar Evento</button>
            </form>
            <div id="msgEstado" class="msg"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const qrContainer = document.getElementById("qrcode");
        const countdownEl = document.getElementById("countdown");
        const nombreEventoEl = document.getElementById("nombreEvento");
        const infoConfigEl = document.getElementById("infoConfig");
        const msgGpsEl = document.getElementById("msgGps");
        const selectEvento = document.getElementById("selectEvento");
        const inputDistancia = document.getElementById("inputDistancia");
        const msgEstado = document.getElementById("msgEstado");
        
        let qrcode = new QRCode(qrContainer, { width: 200, height: 200 });
        let timeLeft = 15;
        let eventoActualId = null;
        let eventoActualClave = "EVENTO_DEFAULT";
        let timerInterval = null;

        async function generarTokenAleatorio(clave) {
            const bloque = Math.floor(Date.now() / 15000);
            const textoSecreto = clave + "_" + bloque + "_FACP_AFI_SECRET_2026";
            const encoder = new TextEncoder();
            const data = encoder.encode(textoSecreto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 10);
        }

        async function cargarListaEventos() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('id, nombre, clave_evento, radio_metros, activo');

                if (error) throw error;

                selectEvento.innerHTML = '';
                data.forEach(ev => {
                    const option = document.createElement('option');
                    option.value = ev.id;
                    option.textContent = ev.nombre + ' (' + ev.clave_evento + ')';
                    option.dataset.clave = ev.clave_evento;
                    option.dataset.radio = ev.radio_metros || 70;
                    if (ev.activo) {
                        option.selected = true;
                        eventoActualId = ev.id;
                        eventoActualClave = ev.clave_evento;
                        nombreEventoEl.textContent = ev.nombre;
                        inputDistancia.value = ev.radio_metros || 70;
                        infoConfigEl.textContent = `📍 Radio de cobertura: ${inputDistancia.value}m`;
                    }
                    selectEvento.appendChild(option);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function cambiarEventoActivo() {
            const eventoId = selectEvento.value;
            const selectedOption = selectEvento.options[selectEvento.selectedIndex];
            
            try {
                // Desactivar todos y activar el seleccionado
                await supabaseClient.from('eventos').update({ activo: false }).neq('id', eventoId);
                await supabaseClient.from('eventos').update({ activo: true }).eq('id', eventoId);

                eventoActualId = eventoId;
                eventoActualClave = selectedOption.dataset.clave;
                nombreEventoEl.textContent = selectedOption.textContent.split(' (')[0];
                inputDistancia.value = selectedOption.dataset.radio || 70;
                infoConfigEl.textContent = `📍 Radio de cobertura: ${inputDistancia.value}m`;

                await actualizarQR();
            } catch (err) {
                alert("Error al cambiar de evento.");
            }
        }

        async function actualizarRadioCobertura() {
            if (!eventoActualId) return;
            const nuevoRadio = parseInt(inputDistancia.value);
            await supabaseClient.from('eventos').update({ radio_metros: nuevoRadio }).eq('id', eventoActualId);
            infoConfigEl.textContent = `📍 Radio de cobertura: ${nuevoRadio}m`;
        }

        async function crearNuevoEvento(e) {
            e.preventDefault();
            const nombre = document.getElementById('nuevoNombre').value.trim();
            const clave = document.getElementById('nuevaClave').value.trim().toUpperCase();

            msgEstado.className = "msg";
            msgEstado.textContent = "Creando evento...";

            try {
                // Desactivar eventos anteriores
                await supabaseClient.from('eventos').update({ activo: false });

                // Insertar el nuevo evento como activo
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .insert([{ nombre: nombre, clave_evento: clave, activo: true, radio_metros: 70 }])
                    .select()
                    .single();

                if (error) {
                    if (error.code === '23505') throw new Error("La clave de evento ya existe. Usa otra.");
                    throw error;
                }

                msgEstado.className = "msg success";
                msgEstado.textContent = "¡Evento creado y activado con éxito!";
                
                document.getElementById('formNuevoEvento').reset();
                await cargarListaEventos();
                await iniciarGPSYTransmision();

            } catch (err) {
                msgEstado.className = "msg error";
                msgEstado.textContent = "Error: " + err.message;
            }
        }

        async function actualizarQR() {
            const tokenAleatorio = await generarTokenAleatorio(eventoActualClave);
            const urlEstudiante = `https://1jecc.github.io/honorio/asistencia.html?token=${tokenAleatorio}&clave=${eventoActualClave}`;
            
            qrcode.makeCode(urlEstudiante);
            timeLeft = 15;
        }

        async function iniciarGPSYTransmision() {
            if (!navigator.geolocation) {
                msgGpsEl.textContent = "⚠️ Tu navegador no soporta geolocalización.";
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                if (eventoActualId) {
                    await supabaseClient
                        .from('eventos')
                        .update({ lat: lat, lon: lon })
                        .eq('id', eventoActualId);
                }

                msgGpsEl.textContent = ""; 
                await actualizarQR();

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(async () => {
                    timeLeft--;
                    countdownEl.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        await actualizarQR();
                    }
                }, 1000);

            }, (error) => {
                msgGpsEl.textContent = "⚠️ Debes permitir el acceso a tu ubicación GPS.";
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        async function iniciarSistema() {
            await cargarListaEventos();
            await iniciarGPSYTransmision();
        }

        iniciarSistema();
    </script>
</body>
</html>
