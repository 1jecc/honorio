<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Panel del Expositor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: white; text-align: center; padding: 15px; margin: 0; transition: 0.3s; }
        .top-bar { display: flex; justify-content: center; align-items: center; max-width: 650px; margin: 0 auto 15px auto; width: 100%; gap: 15px; flex-wrap: wrap; }
        .btn-nav { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.35); }
        h1 { font-size: 1.8rem; margin: 5px 0; }
        #nombreEvento { color: #f39c12; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        
        .container { background: white; color: #333; display: inline-block; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: 0.3s; cursor: pointer; }
        .container:hover { transform: scale(1.02); }
        
        #qrcode { margin: 10px auto; display: flex; justify-content: center; }
        .timer { font-size: 1.1rem; font-weight: bold; color: #e74c3c; margin-top: 12px; }
        .error-gps { color: #ff6b6b; font-weight: bold; margin-top: 15px; font-size: 0.9rem; }

        /* MODO PANTALLA GIGANTE LIMPIO */
        body.modo-gigante .top-bar,
        body.modo-gigante h1,
        body.modo-gigante #nombreEvento,
        body.modo-gigante #msgGps {
            display: none !important;
        }
        body.modo-gigante {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0;
        }
        body.modo-gigante .container {
            padding: 50px;
            border-radius: 35px;
            box-shadow: 0 0 70px rgba(0,0,0,0.9);
            transform: none !important;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR SIMPLIFICADA -->
    <div class="top-bar">
        <a href="index.html" class="btn-nav">⚙️ Volver a Configuración</a>
        <span style="font-size: 0.85rem; color: #dfe4ea;">💡 <i>Tip: Clic en el QR para ampliar</i></span>
    </div>

    <h1>SIASE - Panel del Expositor</h1>
    <div id="nombreEvento">🔄 Sincronizando evento...</div>

    <!-- CONTENEDOR DEL QR (Clic entra a gigante, doble clic sale y activa pantalla completa nativa) -->
    <div class="container" id="cardContainer" onclick="entrarModoGigante()" ondblclick="salirModoGigante()">
        <div id="qrcode"></div>
        <p class="timer">⏱️ Rota en: <span id="countdown">15</span>s</p>
    </div>
    
    <div id="msgGps" class="error-gps"></div>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const qrContainer = document.getElementById("qrcode");
        const countdownEl = document.getElementById("countdown");
        const nombreEventoEl = document.getElementById("nombreEvento");
        const msgGpsEl = document.getElementById("msgGps");
        
        let qrcode = new QRCode(qrContainer, { width: 250, height: 250 });
        let timeLeft = 15;
        let eventoActualId = null;
        let eventoActualClave = "EVENTO_DEFAULT";
        let timerInterval = null;
        let modoGiganteActivo = false;

        function entrarModoGigante() {
            if (modoGiganteActivo) return;
            modoGiganteActivo = true;
            document.body.classList.add('modo-gigante');
            
            // Activa automáticamente la pantalla completa del navegador al hacer clic en el QR
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            redibujarQR(450);
        }

        function salirModoGigante() {
            if (!modoGiganteActivo) return;
            modoGiganteActivo = false;
            document.body.classList.remove('modo-gigante');

            // Sale de la pantalla completa del navegador al dar doble clic
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }

            redibujarQR(250);
        }

        function redibujarQR(tamanio) {
            qrContainer.innerHTML = "";
            qrcode = new QRCode(qrContainer, { width: tamanio, height: tamanio });
            actualizarQR();
        }

        async function generarTokenAleatorio(clave) {
            const bloque = Math.floor(Date.now() / 15000);
            const textoSecreto = clave + "_" + bloque + "_FACP_AFI_SECRET_2026";
            const encoder = new TextEncoder();
            const data = encoder.encode(textoSecreto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 10);
        }

        async function actualizarQR() {
            const tokenAleatorio = await generarTokenAleatorio(eventoActualClave);
            const urlEstudiante = `https://1jecc.github.io/honorio/asistencia.html?token=${tokenAleatorio}&clave=${eventoActualClave}`;
            
            qrcode.makeCode(urlEstudiante);
            timeLeft = 15;
        }

        async function iniciarSistema() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .eq('activo', true)
                    .single();

                if (error || !data) {
                    nombreEventoEl.textContent = "⚠️ No hay eventos activos";
                    return;
                }

                eventoActualId = data.id;
                eventoActualClave = data.clave_evento;
                nombreEventoEl.textContent = data.nombre;

                if (!navigator.geolocation) {
                    msgGpsEl.textContent = "⚠️ Tu navegador no soporta geolocalización.";
                    return;
                }

                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    await supabaseClient
                        .from('eventos')
                        .update({ lat: lat, lon: lon })
                        .eq('id', eventoActualId);

                    msgGpsEl.textContent = ""; 
                    await actualizarQR();

                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(async () => {
                        timeLeft--;
                        countdownEl.textContent = timeLeft;
                        if (timeLeft <= 0) {
                            await actualizarQR();
                        }
                    }, 1000);

                }, (error) => {
                    msgGpsEl.textContent = "⚠️ Debes permitir el acceso a tu ubicación GPS.";
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });

            } catch (err) {
                console.error("Error general:", err);
                nombreEventoEl.textContent = "❌ Error de conexión con la base de datos";
            }
        }

        iniciarSistema();
    </script>
</body>
</html>
