<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIASE - Panel del Expositor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #002b49; color: white; text-align: center; padding: 15px; margin: 0; transition: 0.3s; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 650px; margin: 0 auto 15px auto; width: 100%; flex-wrap: wrap; gap: 8px; }
        .btn-nav { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.35); }
        h1 { font-size: 1.8rem; margin: 5px 0; }
        #nombreEvento { color: #f39c12; font-size: 1.3rem; font-weight: bold; margin-bottom: 3px; }
        .info-config { font-size: 0.9rem; color: #dfe4ea; margin-bottom: 20px; }
        .container { background: white; color: #333; display: inline-block; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: 0.3s; }
        #qrcode { margin: 10px auto; display: flex; justify-content: center; }
        .timer { font-size: 1.1rem; font-weight: bold; color: #e74c3c; margin-top: 12px; }
        .error-gps { color: #ff6b6b; font-weight: bold; margin-top: 15px; font-size: 0.9rem; }

        /* MODO QR GIGANTE SIN BOTONES EXTRA */
        body.modo-gigante .top-bar,
        body.modo-gigante h1,
        body.modo-gigante #nombreEvento,
        body.modo-gigante .info-config,
        body.modo-gigante #msgGps {
            display: none !important;
        }
        body.modo-gigante {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 0;
            cursor: pointer; /* Indica que se puede hacer clic para salir */
        }
        body.modo-gigante .container {
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body onclick="manejarClickGlobal(event)">

    <!-- BARRA SUPERIOR VISIBLE -->
    <div class="top-bar">
        <a href="index.html" class="btn-nav">⚙️ Volver a Configuración</a>
        <button onclick="toggleModoGigante(event)" class="btn-nav">🔍 Pantalla Gigante QR</button>
        <button onclick="toggleFullScreen(event)" class="btn-nav">📺 Pantalla Completa</button>
    </div>

    <h1>SIASE - Panel del Expositor</h1>
    <div id="nombreEvento">🔄 Sincronizando evento...</div>
    <div id="infoConfig" class="info-config"></div>

    <div class="container" id="cardContainer">
        <div id="qrcode"></div>
        <p class="timer">⏱️ Rota en: <span id="countdown">15</span>s</p>
    </div>
    
    <div id="msgGps" class="error-gps"></div>

    <script>
        const SUPABASE_URL = 'https://phodrnfzvxowxhewhbbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2RybmZ6dnhvd3hoZXdoYmJxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzM3MTcyNywiZXhwIjoyMTA4OTQ3NzI3fQ.usSIHWjncmGDNu6COe9Vo0kL3x_vsQfBGhDEqC7LJQg'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const qrContainer = document.getElementById("qrcode");
        const countdownEl = document.getElementById("countdown");
        const nombreEventoEl = document.getElementById("nombreEvento");
        const infoConfigEl = document.getElementById("infoConfig");
        const msgGpsEl = document.getElementById("msgGps");
        
        let qrcode = new QRCode(qrContainer, { width: 250, height: 250 });
        let timeLeft = 15;
        let eventoActualId = null;
        let eventoActualClave = "EVENTO_DEFAULT";
        let timerInterval = null;
        let modoGiganteActivo = false;

        function toggleModoGigante(e) {
            if (e) e.stopPropagation(); // Evita que dispare el evento global inmediatamente
            modoGiganteActivo = !modoGiganteActivo;
            document.body.classList.toggle('modo-gigante', modoGiganteActivo);
            
            qrContainer.innerHTML = "";
            let nuevoAncho = modoGiganteActivo ? 450 : 250;
            qrcode = new QRCode(qrContainer, { width: nuevoAncho, height: nuevoAncho });
            actualizarQR();
        }

        // Si está en modo gigante y hace clic en cualquier parte de la pantalla (fuera del cuadro blanco), se sale
        function manejarClickGlobal(e) {
            if (modoGiganteActivo) {
                // Si hace clic directamente en el fondo oscuro
                modoGiganteActivo = false;
                document.body.classList.remove('modo-gigante');
                qrContainer.innerHTML = "";
                qrcode = new QRCode(qrContainer, { width: 250, height: 250 });
                actualizarQR();
            }
        }

        function toggleFullScreen(e) {
            if (e) e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert("No se pudo activar la pantalla completa: " + err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        async function generarTokenAleatorio(clave) {
            const bloque = Math.floor(Date.now() / 15000);
            const textoSecreto = clave + "_" + bloque + "_FACP_AFI_SECRET_2026";
            const encoder = new TextEncoder();
            const data = encoder.encode(textoSecreto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 10);
        }

        async function actualizarQR() {
            const tokenAleatorio = await generarTokenAleatorio(eventoActualClave);
            const urlEstudiante = `https://1jecc.github.io/honorio/asistencia.html?token=${tokenAleatorio}&clave=${eventoActualClave}`;
            
            qrcode.makeCode(urlEstudiante);
            timeLeft = 15;
        }

        async function iniciarSistema() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .eq('activo', true)
                    .single();

                if (error || !data) {
                    nombreEventoEl.textContent = "⚠️ No hay eventos activos";
                    infoConfigEl.textContent = "Configura un evento desde la página principal.";
                    return;
                }

                eventoActualId = data.id;
                eventoActualClave = data.clave_evento;
                nombreEventoEl.textContent = data.nombre;
                infoConfigEl.textContent = `📍 Radio de cobertura: ${data.radio_metros || 70} metros`;

                if (!navigator.geolocation) {
                    msgGpsEl.textContent = "⚠️ Tu navegador no soporta geolocalización.";
                    return;
                }

                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    await supabaseClient
                        .from('eventos')
                        .update({ lat: lat, lon: lon })
                        .eq('id', eventoActualId);

                    msgGpsEl.textContent = ""; 
                    await actualizarQR();

                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(async () => {
                        timeLeft--;
                        countdownEl.textContent = timeLeft;
                        if (timeLeft <= 0) {
                            await actualizarQR();
                        }
                    }, 1000);

                }, (error) => {
                    msgGpsEl.textContent = "⚠️ Debes permitir el acceso a tu ubicación GPS.";
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });

            } catch (err) {
                console.error("Error general:", err);
                nombreEventoEl.textContent = "❌ Error de conexión con la base de datos";
            }
        }

        iniciarSistema();
    </script>
</body>
</html>
